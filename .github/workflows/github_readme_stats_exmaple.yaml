name: Generate README cards example

on:
  workflow_dispatch:

jobs:
  stats_theme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        theme: [default, default_repocard, transparent, shadow_red, shadow_green, shadow_blue, dark, radical, merko, gruvbox, gruvbox_light, tokyonight, onedark, cobalt, synthwave, highcontrast, dracula, prussian, monokai, vue, vue-dark, shades-of-purple, nightowl, buefy, blue-green, algolia, great-gatsby, darcula, bear, solarized-dark, solarized-light, chartreuse-dark, nord, gotham, material-palenight, graywhite, vision-friendly-dark, ayu-mirage, midnight-purple, calm, flag-india, omni, react, jolly, maroongold, yeblu, blueberry, slateorange, kacho_ga, outrun, ocean_dark, city_lights, github_dark, github_dark_dimmed, discord_old_blurple, aura_dark, panda, noctis_minimus, cobalt2, swift, aura, apprentice, moltack, codeSTACKr, rose_pine, catppuccin_latte, catppuccin_mocha, date_night, one_dark_pro, rose, holi, neon, blue_navy, calm_pink, ambient_gradient]

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats ${{ matrix.theme }} card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=zzx517&show_icons=true&theme=${{ matrix.theme }}
          path: profile/github-readme-stats-theme_${{ matrix.theme }}.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push *.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: grs_example
          build_dir: profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  top-langs_theme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        theme: [default, default_repocard, transparent, shadow_red, shadow_green, shadow_blue, dark, radical, merko, gruvbox, gruvbox_light, tokyonight, onedark, cobalt, synthwave, highcontrast, dracula, prussian, monokai, vue, vue-dark, shades-of-purple, nightowl, buefy, blue-green, algolia, great-gatsby, darcula, bear, solarized-dark, solarized-light, chartreuse-dark, nord, gotham, material-palenight, graywhite, vision-friendly-dark, ayu-mirage, midnight-purple, calm, flag-india, omni, react, jolly, maroongold, yeblu, blueberry, slateorange, kacho_ga, outrun, ocean_dark, city_lights, github_dark, github_dark_dimmed, discord_old_blurple, aura_dark, panda, noctis_minimus, cobalt2, swift, aura, apprentice, moltack, codeSTACKr, rose_pine, catppuccin_latte, catppuccin_mocha, date_night, one_dark_pro, rose, holi, neon, blue_navy, calm_pink, ambient_gradient]

    steps:
      - uses: actions/checkout@v6

      - name: Generate top-langs ${{ matrix.theme }} card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=zzx517&langs_count=6&theme=${{ matrix.theme }}
          path: profile/github-readme-top-langs-theme_${{ matrix.theme }}.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push *.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: grs_example
          build_dir: profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  top-langs_layout:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        layout: [compact, donut, donut-vertical, pie]

    steps:
      - uses: actions/checkout@v6

      - name: Generate top-langs ${{ matrix.layout }} card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=zzx517&langs_count=6&layout=${{ matrix.layout }}
          path: profile/github-readme-top-langs-layout_${{ matrix.layout }}.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push *.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: grs_example
          build_dir: profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
